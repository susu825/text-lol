<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>王者人格测试 · 测测你最像哪位英雄</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  background:linear-gradient(160deg,#eef4ff 0%,#f4f0ff 40%,#eaf6ff 100%);
  background-attachment:fixed;
  color:#1a2340;min-height:100vh;overflow-x:hidden;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative}

/* ===== 背景光晕 ===== */
.bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.glow{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;pointer-events:none}
.glow-1{width:320px;height:320px;background:#a8c5ff;top:-80px;left:-100px;animation:float1 18s ease-in-out infinite}
.glow-2{width:280px;height:280px;background:#d5b8ff;top:40%;right:-120px;animation:float2 22s ease-in-out infinite}
.glow-3{width:260px;height:260px;background:#a8ecff;bottom:-60px;left:-60px;animation:float3 20s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,80px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-50px)}}
@keyframes float3{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,-60px)}}

#app>*{position:relative;z-index:1}

/* ===== 通用 ===== */
.page{display:none}
.page.active{display:block;animation:pageIn .45s cubic-bezier(.22,1,.36,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 40px rgba(74,125,255,.55)}50%{transform:scale(1.1);box-shadow:0 0 60px rgba(74,125,255,.8)}}

/* ===== 首页 ===== */
.home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 26px 40px;text-align:center}
.home-visual{position:relative;width:180px;height:180px;margin-bottom:28px;display:flex;align-items:center;justify-content:center}
.hex-ring{position:absolute;border-radius:50%;border:1.5px solid transparent}
.ring-1{width:180px;height:180px;border-top-color:#4a7dff;border-right-color:rgba(74,125,255,.25);animation:spin 12s linear infinite}
.ring-2{width:140px;height:140px;border-bottom-color:#8b5cf6;border-left-color:rgba(139,92,246,.25);animation:spin 9s linear infinite reverse}
.ring-3{width:100px;height:100px;border-top-color:#06b6d4;border-left-color:rgba(6,182,212,.2);animation:spin 6s linear infinite}
.core{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#4a7dff,#8b5cf6);box-shadow:0 0 40px rgba(74,125,255,.55),0 0 80px rgba(139,92,246,.3);animation:pulse 2.5s ease-in-out infinite}

.home-badge{display:inline-block;padding:5px 16px;border-radius:20px;font-size:11px;color:#4a7dff;letter-spacing:3px;font-weight:700;background:rgba(255,255,255,.7);border:1px solid rgba(74,125,255,.3);box-shadow:0 4px 16px rgba(74,125,255,.12);margin-bottom:22px}
.home-title{font-size:36px;font-weight:900;line-height:1.18;letter-spacing:-1px;margin-bottom:12px;background:linear-gradient(135deg,#3b6fff,#8b5cf6 60%,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.home-sub{font-size:14px;color:#5a6785;line-height:1.7;margin-bottom:6px}
.home-desc{font-size:12.5px;color:#8a94ad;margin-bottom:30px;line-height:1.6}
.home-stats{display:flex;gap:0;margin-bottom:34px;background:rgba(255,255,255,.75);backdrop-filter:blur(16px);border:1px solid rgba(120,150,255,.2);border-radius:20px;padding:16px 8px;box-shadow:0 8px 28px rgba(90,130,255,.1)}
.home-stat{flex:1;text-align:center;position:relative}
.home-stat+.home-stat::before{content:'';position:absolute;left:0;top:20%;height:60%;width:1px;background:rgba(120,150,255,.2)}
.home-stat .num{font-size:22px;font-weight:900;background:linear-gradient(135deg,#4a7dff,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.home-stat .label{font-size:10.5px;color:#8a94ad;margin-top:3px;letter-spacing:.5px}
.home-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:17px 56px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,#4a7dff,#8b5cf6);border:none;border-radius:50px;cursor:pointer;letter-spacing:3px;box-shadow:0 10px 30px rgba(74,125,255,.4),0 0 0 1px rgba(255,255,255,.2) inset;transition:all .25s}
.home-btn:active{transform:scale(.96);box-shadow:0 6px 20px rgba(74,125,255,.5)}
.home-footer{margin-top:26px;font-size:10.5px;color:#9aa4bd;letter-spacing:.5px}

/* ===== 答题页 ===== */
.quiz{min-height:100vh;display:flex;flex-direction:column;padding:22px 20px 110px}
.quiz-header{margin-bottom:22px}
.quiz-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.quiz-counter{font-size:12px;color:#8a94ad;font-weight:600;letter-spacing:1px}
.quiz-counter span{color:#4a7dff;font-size:19px;font-weight:900;margin:0 2px}
.quiz-tag{font-size:10px;color:#4a7dff;background:rgba(74,125,255,.1);padding:3px 10px;border-radius:10px;font-weight:700;letter-spacing:1px}
.quiz-bar-bg{height:6px;background:rgba(120,150,255,.14);border-radius:3px;overflow:hidden}
.quiz-bar{height:100%;background:linear-gradient(90deg,#4a7dff,#8b5cf6,#06b6d4);border-radius:3px;transition:width .45s cubic-bezier(.22,1,.36,1);width:0;box-shadow:0 0 12px rgba(74,125,255,.5)}

.quiz-scene{background:rgba(255,255,255,.82);backdrop-filter:blur(18px);border:1px solid rgba(120,150,255,.22);border-radius:22px;padding:24px 22px;margin-bottom:18px;box-shadow:0 10px 34px rgba(90,130,255,.1);position:relative;overflow:hidden}
.quiz-scene::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,#4a7dff,#8b5cf6,#06b6d4)}
.quiz-scene-label{font-size:10.5px;color:#4a7dff;letter-spacing:3px;margin-bottom:12px;font-weight:800}
.quiz-scene-text{font-size:15.5px;line-height:1.85;color:#2a3450;font-weight:500}

.quiz-options{display:flex;flex-direction:column;gap:11px}
.quiz-option{padding:16px 17px;background:rgba(255,255,255,.78);backdrop-filter:blur(12px);border:1.5px solid rgba(120,150,255,.18);border-radius:16px;cursor:pointer;transition:all .22s cubic-bezier(.22,1,.36,1);font-size:14px;line-height:1.65;color:#3b4a6b;display:flex;gap:12px;align-items:flex-start;box-shadow:0 2px 10px rgba(90,130,255,.05)}
.quiz-option:active{transform:scale(.985)}
.quiz-option .opt-key{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:8px;background:rgba(74,125,255,.1);color:#4a7dff;font-size:11.5px;font-weight:900;margin-top:1px;flex-shrink:0;transition:all .22s}
.quiz-option.selected{background:linear-gradient(135deg,rgba(74,125,255,.12),rgba(139,92,246,.1));border-color:#4a7dff;color:#1a2340;box-shadow:0 6px 22px rgba(74,125,255,.2);transform:translateY(-1px)}
.quiz-option.selected .opt-key{background:linear-gradient(135deg,#4a7dff,#8b5cf6);color:#fff}

.quiz-footer{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(238,244,255,.98) 60%,rgba(238,244,255,0));display:flex;gap:12px;z-index:20}
.nav-btn{flex:1;padding:15px;border-radius:16px;font-size:15px;font-weight:800;letter-spacing:1px;border:none;cursor:pointer;transition:all .22s;display:flex;align-items:center;justify-content:center;gap:6px}
.nav-btn.prev{background:rgba(255,255,255,.9);color:#5a6785;border:1.5px solid rgba(120,150,255,.25);box-shadow:0 4px 14px rgba(90,130,255,.08)}
.nav-btn.prev:disabled{opacity:.4;cursor:not-allowed}
.nav-btn.next{background:linear-gradient(135deg,#4a7dff,#8b5cf6);color:#fff;box-shadow:0 8px 24px rgba(74,125,255,.35)}
.nav-btn.next:disabled{background:rgba(120,150,255,.15);color:#a8b2c8;box-shadow:none;cursor:not-allowed}
.nav-btn:not(:disabled):active{transform:scale(.97)}

/* ===== 加载页 ===== */
.loading{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px}
.loading-visual{position:relative;width:120px;height:120px;margin-bottom:32px;display:flex;align-items:center;justify-content:center}
.loading-ring{position:absolute;border-radius:50%;border:2px solid transparent}
.loading-ring.r1{width:120px;height:120px;border-top-color:#4a7dff;border-right-color:rgba(74,125,255,.2);animation:spin 1.4s linear infinite}
.loading-ring.r2{width:88px;height:88px;border-bottom-color:#8b5cf6;border-left-color:rgba(139,92,246,.2);animation:spin 1.1s linear infinite reverse}
.loading-ring.r3{width:56px;height:56px;border-top-color:#06b6d4;animation:spin .8s linear infinite}
.loading-core{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#4a7dff,#8b5cf6);box-shadow:0 0 24px rgba(74,125,255,.6);animation:pulse 1.4s ease-in-out infinite}
.loading-text{font-size:14px;color:#5a6785;letter-spacing:3px;font-weight:600;margin-bottom:8px}
.loading-sub{font-size:11.5px;color:#9aa4bd;letter-spacing:1px}

/* ===== 结果页 ===== */
.result{min-height:100vh;padding:26px 18px 56px}
.result-hero{text-align:center;margin-bottom:20px}
.hero-tag{display:inline-block;padding:4px 16px;border-radius:20px;font-size:10.5px;color:#4a7dff;letter-spacing:3px;font-weight:800;background:rgba(255,255,255,.8);border:1px solid rgba(74,125,255,.3);box-shadow:0 4px 14px rgba(74,125,255,.12);margin-bottom:18px}
.hero-avatar-wrap{position:relative;width:150px;height:150px;margin:0 auto 18px;display:flex;align-items:center;justify-content:center}
.avatar-ring{position:absolute;border-radius:50%;border:1.5px solid transparent}
.ar1{width:150px;height:150px;border-top-color:#4a7dff;border-right-color:rgba(74,125,255,.25);animation:spin 14s linear infinite}
.ar2{width:132px;height:132px;border-bottom-color:#8b5cf6;border-left-color:rgba(139,92,246,.25);animation:spin 10s linear infinite reverse}
.hero-avatar{width:114px;height:114px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 8px 32px rgba(74,125,255,.35),0 0 0 1px rgba(74,125,255,.2);background:linear-gradient(135deg,#4a7dff,#8b5cf6)}
.hero-name{font-size:30px;font-weight:900;letter-spacing:1px;background:linear-gradient(135deg,#3b6fff,#8b5cf6 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.hero-title{font-size:12.5px;color:#5a6785;letter-spacing:1.5px;margin-bottom:14px}
.hero-quote{font-size:13px;color:#4a7dff;font-weight:600;padding:11px 20px;background:rgba(255,255,255,.85);border:1px solid rgba(74,125,255,.2);border-radius:14px;display:inline-block;max-width:92%;line-height:1.65;box-shadow:0 6px 20px rgba(74,125,255,.1)}

.card{background:rgba(255,255,255,.85);backdrop-filter:blur(18px);border:1px solid rgba(120,150,255,.2);border-radius:20px;padding:22px 20px;margin-bottom:14px;box-shadow:0 8px 28px rgba(90,130,255,.1);position:relative;overflow:hidden}
.card-title{font-size:12.5px;color:#3b6fff;letter-spacing:2px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;gap:9px}
.card-title::before{content:'';width:4px;height:15px;background:linear-gradient(180deg,#4a7dff,#8b5cf6);border-radius:2px}
.card-title .en{font-size:9.5px;color:#a8b2c8;letter-spacing:1px;font-weight:600;margin-left:auto}
.card p{font-size:13.5px;line-height:1.9;color:#3b4a6b}

.radar-wrap{position:relative;width:100%;max-width:320px;margin:0 auto}
#radarCanvas{width:100%;display:block}

.dim-list{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.dim-row{display:flex;align-items:center;gap:10px}
.dim-name{font-size:11.5px;color:#5a6785;width:44px;font-weight:700;flex-shrink:0}
.dim-track{flex:1;height:7px;background:rgba(120,150,255,.12);border-radius:4px;overflow:hidden}
.dim-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,#4a7dff,#8b5cf6);transition:width .9s cubic-bezier(.22,1,.36,1);width:0}
.dim-val{font-size:11.5px;color:#4a7dff;font-weight:900;width:34px;text-align:right;flex-shrink:0}

.traits{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.trait{padding:7px 15px;border-radius:20px;font-size:12px;font-weight:700;background:linear-gradient(135deg,rgba(74,125,255,.12),rgba(139,92,246,.1));color:#3b6fff;border:1px solid rgba(74,125,255,.25)}

.partner-box{display:flex;align-items:center;gap:14px;padding:16px;background:linear-gradient(135deg,rgba(74,125,255,.07),rgba(139,92,246,.07));border-radius:16px;border:1px solid rgba(74,125,255,.18);margin-bottom:12px}
.partner-avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2.5px solid #fff;box-shadow:0 6px 18px rgba(74,125,255,.3);flex-shrink:0;background:linear-gradient(135deg,#4a7dff,#8b5cf6)}
.partner-info{flex:1;min-width:0}
.partner-name{font-size:16px;font-weight:900;color:#1a2340;margin-bottom:4px}
.partner-reason{font-size:12px;color:#5a6785;line-height:1.6}
.partner-badge{display:inline-block;font-size:9.5px;color:#fff;background:linear-gradient(135deg,#4a7dff,#8b5cf6);padding:2px 9px;border-radius:8px;font-weight:800;letter-spacing:1px;margin-bottom:6px}

.info-grid{display:flex;flex-direction:column;gap:12px}
.info-item{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:rgba(120,150,255,.06);border-radius:14px;border-left:3px solid #4a7dff}
.info-icon{font-size:17px;flex-shrink:0;line-height:1.4}
.info-body{flex:1}
.info-label{font-size:10.5px;color:#8a94ad;letter-spacing:1.5px;font-weight:800;margin-bottom:4px}
.info-text{font-size:13px;color:#3b4a6b;line-height:1.7;font-weight:500}
.info-item.purple{border-left-color:#8b5cf6}
.info-item.cyan{border-left-color:#06b6d4}

.sw-grid{display:flex;flex-direction:column;gap:11px}
.sw-item{padding:15px 17px;border-radius:14px;font-size:13px;line-height:1.75;color:#3b4a6b}
.sw-item.good{background:linear-gradient(135deg,rgba(16,185,129,.09),rgba(16,185,129,.04));border:1px solid rgba(16,185,129,.22)}
.sw-item.warn{background:linear-gradient(135deg,rgba(245,158,11,.09),rgba(245,158,11,.04));border:1px solid rgba(245,158,11,.22)}
.sw-label{font-size:11px;font-weight:900;letter-spacing:1.5px;margin-bottom:7px;display:block}
.sw-label.good{color:#059669}
.sw-label.warn{color:#d97706}

.advice-box{padding:16px 18px;background:linear-gradient(135deg,rgba(74,125,255,.08),rgba(139,92,246,.06));border-radius:16px;border:1px solid rgba(74,125,255,.18);font-size:13.5px;line-height:1.9;color:#2a3450}

.summary-box{text-align:center;padding:20px 16px;background:linear-gradient(135deg,rgba(74,125,255,.1),rgba(139,92,246,.08));border-radius:18px;border:1px solid rgba(74,125,255,.2)}
.summary-box .big{font-size:15px;font-weight:900;color:#3b6fff;letter-spacing:.5px;line-height:1.7}

.result-actions{display:flex;gap:12px;margin-top:20px}
.result-btn{flex:1;padding:15px;border-radius:16px;font-size:14.5px;font-weight:800;text-align:center;cursor:pointer;transition:all .22s;border:none;letter-spacing:1px}
.result-btn.primary{background:linear-gradient(135deg,#4a7dff,#8b5cf6);color:#fff;box-shadow:0 8px 24px rgba(74,125,255,.35)}
.result-btn.secondary{background:rgba(255,255,255,.9);color:#5a6785;border:1.5px solid rgba(120,150,255,.25);box-shadow:0 4px 14px rgba(90,130,255,.08)}
.result-btn:active{transform:scale(.97)}
.watermark{text-align:center;margin-top:22px;font-size:10px;color:#b8c0d4;letter-spacing:1px}

.egg{margin-top:14px;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,rgba(6,182,212,.08),rgba(74,125,255,.06));border:1px dashed rgba(6,182,212,.35);font-size:12.5px;line-height:1.75;color:#3b4a6b}
.egg-title{font-size:11px;color:#06b6d4;font-weight:900;letter-spacing:2px;margin-bottom:6px}
.egg strong{color:#3b6fff}
</style>
</head>
<body>
<canvas class="bg-canvas" id="bgCanvas"></canvas>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<div id="app">

<!-- ==================== 首页 ==================== -->
<div class="page active" id="pageHome">
  <div class="home">
    <div class="home-visual">
      <div class="hex-ring ring-1"></div>
      <div class="hex-ring ring-2"></div>
      <div class="hex-ring ring-3"></div>
      <div class="core"></div>
    </div>
    <div class="home-badge">◈ WZTI 王者人格测试 ◈</div>
    <h1 class="home-title">你的本命<br>英雄是谁？</h1>
    <p class="home-sub">30 道生活情景题 · 深度人格解析</p>
    <p class="home-desc">不是简单的性格标签<br>而是从你的真实选择里，看见你</p>
    <div class="home-stats">
      <div class="home-stat"><div class="num">30</div><div class="label">情景题</div></div>
      <div class="home-stat"><div class="num">20</div><div class="label">英雄结果</div></div>
      <div class="home-stat"><div class="num">6</div><div class="label">人格维度</div></div>
    </div>
    <button class="home-btn" onclick="startQuiz()">⚔ 开始测试</button>
    <p class="home-footer">测试结果仅供娱乐参考 · 不收集任何个人信息</p>
  </div>
</div>

<!-- ==================== 答题页 ==================== -->
<div class="page" id="pageQuiz">
  <div class="quiz">
    <div class="quiz-header">
      <div class="quiz-top">
        <div class="quiz-counter">第 <span id="qCurrent">1</span> / 30 题</div>
        <div class="quiz-tag">◈ 深度情景</div>
      </div>
      <div class="quiz-bar-bg"><div class="quiz-bar" id="qBar"></div></div>
    </div>
    <div class="quiz-scene">
      <div class="quiz-scene-label">SCENE <span id="qSceneNum">01</span></div>
      <div class="quiz-scene-text" id="qSceneText"></div>
    </div>
    <div class="quiz-options" id="qOptions"></div>
  </div>
  <div class="quiz-footer">
    <button class="nav-btn prev" id="btnPrev" onclick="prevQuestion()">← 上一题</button>
    <button class="nav-btn next" id="btnNext" onclick="nextQuestion()">下一题 →</button>
  </div>
</div>

<!-- ==================== 加载页 ==================== -->
<div class="page" id="pageLoading">
  <div class="loading">
    <div class="loading-visual">
      <div class="loading-ring r1"></div>
      <div class="loading-ring r2"></div>
      <div class="loading-ring r3"></div>
      <div class="loading-core"></div>
    </div>
    <div class="loading-text" id="loadText">正在解析你的人格数据</div>
    <div class="loading-sub">匹配 20 位英雄中...</div>
  </div>
</div>

<!-- ==================== 结果页 ==================== -->
<div class="page" id="pageResult">
  <div class="result">
    <div class="result-hero" id="rHero"></div>

    <div class="card">
      <div class="card-title">六维人格雷达<span class="en">PERSONALITY RADAR</span></div>
      <div class="radar-wrap"><canvas id="radarCanvas"></canvas></div>
      <div class="dim-list" id="dimList"></div>
    </div>

    <div class="card" id="rPortrait"></div>
    <div class="card" id="rPartner"></div>
    <div class="card" id="rPosition"></div>
    <div class="card" id="rStrength"></div>
    <div class="card" id="rAdvice"></div>
    <div class="card" id="rSummary"></div>

    <div class="result-actions">
      <button class="result-btn secondary" onclick="restartQuiz()">重新测试</button>
      <button class="result-btn primary" onclick="shareResult()">分享结果</button>
    </div>
    <p class="watermark">王者人格测试 WZTI · 仅供娱乐</p>
  </div>
</div>

</div>

<script>
// ==================================================================
//  题库：30 道生活 / 虚拟情景题
//  维度顺序：勇气 / 谋略 / 忠诚 / 进攻性 / 团队性 / 独立性
// ==================================================================

portrait:"你是一个极度独立的人。你不喜欢被束缚，也不喜欢按照别人的节奏行事。你有自己独特的判断标准和行事风格，别人很难真正影响你的决定。你有一种敏锐的直觉，能够快速捕捉到环境和局势的变化，并据此调整自己的策略。你不在乎别人的评价，你只在乎自己是否做到了自己想做的事。",
strength:"极强的独立作战能力和敏锐的局势嗅觉。你总能在别人还没反应过来的时候，已经找到突破口。",
weakness:"过于独立会让你在需要协作时显得疏离，别人很难走进你的世界。",
advice:"你的独立性让你在个人表现上非常出色，但在需要协作的场景中，你的这种特质可能会让你显得不太合群。尝试在保持自我的同时，也给团队留出一些空间。有时候，适当的妥协不是软弱，而是一种更高层次的智慧。",
partnerName:"孙膑",partnerId:152,partnerReason:"他给你加速，你给他结果。你们之间不需要多余的沟通，一个眼神就够了。",
position:"打野 / 自由人",positionDesc:"适合独立作战、自己找机会的位置。你不需要别人给你铺路，你自己就是路。",
hidden:"看起来谁都不需要，其实只是还没遇到值得停下的人。",
summary:"你不是不合群，你只是不愿意为了合群而委屈自己。"},

{name:"张飞",id:171,title:"燕人张翼德 · 无声的守护者",quote:"谁敢与我决一死战！",
traits:["忠诚","守护","可靠","隐忍"],
portrait:"你是那种默默付出、不求回报的人。你不会去争夺聚光灯下的位置，但你做的事情对整个团队至关重要。你有极强的责任感和忠诚心，一旦认定了某个人或某件事，你就会一直坚守下去。你不善于表达自己的情感，但你的行动比任何语言都更有说服力。你的力量不在于进攻，而在于守护。",
strength:"你的存在本身就是队友的安全感。你在，大家就敢打；你不在，大家就会犹豫。",
weakness:"总把自己放在最后，时间久了会忘了自己到底想要什么。",
advice:"你总是把别人的需求放在自己前面，但有时候也需要关注一下自己的感受。你的付出值得被看见，不要害怕表达自己的需求。在团队中，你不仅是守护者，也可以成为发声者，你的意见同样重要。",
partnerName:"赵云",partnerId:107,partnerReason:"他在前面顶伤害，你在后面顶住所有人。没有你他敢冲，没有他你护不住。",
position:"游走 / 辅助",positionDesc:"适合保护队友、承担伤害的位置。你的价值不在数据面板上，而在每一次队友活下来的瞬间。",
hidden:"嗓门最大的人，往往心最软。",
summary:"你不站在光里，但你让站在光里的人不再害怕。"},

{name:"李白",id:131,title:"青莲剑仙 · 自由的浪漫主义者",quote:"可以赶尽，无法杀绝。",
traits:["潇洒","才华","自由","浪漫"],
portrait:"你是一个追求自由和美感的人。你的生活态度是“不将就”，无论是在游戏中选择英雄还是现实中的生活方式，你都有自己的审美标准。你有出色的才华和创造力，但你不会为了迎合别人而改变自己。你喜欢在规则允许的范围内找到自己的表达方式，你的存在本身就是一种态度。",
strength:"不可替代的个人风格和创造力。你做的事情，别人模仿不来。",
weakness:"太过自由会让人觉得你不够可靠，有时候别人需要的是确定性。",
advice:"你的才华和个性是你的魅力所在，但有时候过于追求独特可能会让你错失一些合作机会。学会在保持个性的同时与他人建立连接，会让你的才华被更多人看见。另外，给自己设定一些阶段性目标，会让你的自由不那么漫无目的。",
partnerName:"曜",partnerId:522,partnerReason:"两个都爱自由的人凑在一起，反而谁都拦不住谁。你们互相点燃，也互相兜底。",
position:"打野 / 自由人",positionDesc:"适合需要灵感和创造力的位置。你不适合被规则框住，你适合自己定义规则。",
hidden:"看似随性，其实对认定的事有近乎偏执的坚持。",
summary:"你不是不合规矩，你只是活在自己的规矩里。"},

{name:"花木兰",id:154,title:"传说之刃 · 刚柔并济的战士",quote:"谁说女子不如男？",
traits:["坚韧","适应","担当","不认输"],

strength:"适应力极强，能在任何环境下找到自己的位置。别人还在适应，你已经开始了。",

partnerName:"铠",partnerId:193,partnerReason:"两个都能扛的人在一起，队伍就几乎没有崩盘的可能。你们互相兜底，互相成就。",

{name:"貂蝉",id:141,title:"绝世舞姬 · 以柔克刚的舞者",quote:"华丽又优雅，只可远观。",

partnerName:"元歌",partnerId:125,partnerReason:"两个都复杂、都聪明的人，反而在彼此面前最简单。你们不用装，因为对方一眼就看穿了。",

{name:"铠",id:193,title:"破灭刃锋 · 孤独的守护者",quote:"一个人可以被毁灭，但绝不会被打败。",

strength:"极强的意志力和守护他人的决心。你认定的事，九头牛都拉不回来。",

partnerName:"花木兰",partnerId:154,partnerReason:"你不怕死，她不怕累。一个守，一个攻，你们在一起就是最硬的那块盾。",
position:"对抗路",positionDesc:"适合独自承担压力的位置。你不需要太多支援，因为你自己就是一道防线。",
hidden:"冷脸背后，藏着最深的温柔。",

{name:"鲁班七号",id:112,title:"机关造物 · 天真又强大的存在",quote:"智商二百五，帅得被人砍。",

partnerName:"蔡文姬",partnerId:184,partnerReason:"她给你最温暖的后盾，你给她最漂亮的胜利。你保护她的纯粹，她回报你的付出。",

{name:"弈星",id:197,title:"天元之弈 · 步步为营的布局者",quote:"不得贪胜，不可不胜。",

partnerName:"镜",partnerId:504,partnerReason:"你们都在下一盘很大的棋，只是棋子不同。彼此都懂，不需要多解释。",
position:"中路 / 运营核心",positionDesc:"适合需要全局思维的位置。你不追求一时的爆发，你追求的是让对方慢慢走进你的节奏。",

{name:"马超",id:194,title:"冷晖之枪 · 速度与激情的化身",quote:"即使敌众我寡，末将亦能万军丛中取敌将首级。",

{name:"大乔",id:191,title:"沧海之曜 · 掌控节奏的幕后核心",quote:"守望着天空、大海和你的回忆。",

{name:"项羽",id:108,title:"西楚霸王 · 不屈的战魂",quote:"天不容我，我必逆天！",

partnerName:"狂铁",partnerId:199,partnerReason:"他在明处吸引火力，你在暗处一击致命。配合起来，对面永远不知道为什么打不过。",

{name:"孙膑",id:152,title:"逆流之时 · 温柔的辅助核心",quote:"时间和波浪，变化无常。",

// ==================================================================
//  状态
// ==================================================================
const DIMS = ['courage','wisdom','loyalty','aggression','teamwork','independence'];
const DIM_NAMES = ['勇气','谋略','忠诚','进攻性','团队性','独立性'];
let currentQ = 0;
let answers = new Array(QUESTIONS.length).fill(-1);
let finalValues = [];
let advancing = false;

// 预计算：每道题、每个维度的 min / max（用于 min-max 归一化）
const Q_NORMS = QUESTIONS.map(q=>{
  return DIMS.map((_, i)=>{
    const vals = q.options.map(o => o.d[i]);
    return { min: Math.min(...vals), max: Math.max(...vals) };
  });
});

// ==================================================================
//  页面切换
// ==================================================================
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// ==================================================================
//  答题逻辑
// ==================================================================
function startQuiz(){
  currentQ = 0;
  answers = new Array(QUESTIONS.length).fill(-1);
  advancing = false;
  finalValues = [];
  showPage('pageQuiz');
  renderQuestion();
}

function renderQuestion(){
  const q = QUESTIONS[currentQ];
  document.getElementById('qCurrent').textContent = currentQ + 1;
  document.getElementById('qBar').style.width = ((currentQ + 1) / QUESTIONS.length * 100) + '%';
  document.getElementById('qSceneNum').textContent = String(currentQ + 1).padStart(2,'0');
  document.getElementById('qSceneText').textContent = q.scene;

  const optDiv = document.getElementById('qOptions');
  optDiv.innerHTML = '';
  const keys = ['A','B','C','D'];
  const selected = answers[currentQ];

  q.options.forEach((opt, i)=>{
    const div = document.createElement('div');
    div.className = 'quiz-option' + (selected === i ? ' selected' : '');
    div.innerHTML = `<span class="opt-key">${keys[i]}</span><span>${opt.t}</span>`;
    div.onclick = ()=> selectOption(i);
    optDiv.appendChild(div);
  });

  document.getElementById('btnPrev').disabled = (currentQ === 0);
  const btnNext = document.getElementById('btnNext');
  btnNext.textContent = (currentQ === QUESTIONS.length - 1) ? '查看结果 ✦' : '下一题 →';
  btnNext.disabled = (answers[currentQ] === -1);
}

function selectOption(idx){
  if(advancing) return;

  answers[currentQ] = idx;
  const opts = document.getElementById('qOptions').children;
  for(let i = 0; i < opts.length; i++){
    opts[i].classList.toggle('selected', i === idx);
  }
  document.getElementById('btnNext').disabled = false;

  opts[idx].style.transform = 'scale(.97)';
  setTimeout(()=>{ opts[idx].style.transform = ''; }, 150);

  // 自动跳下一题
  advancing = true;
  setTimeout(()=>{
    advancing = false;
    if(currentQ === QUESTIONS.length - 1){
      submitQuiz();
    }else{
      currentQ++;
      renderQuestion();
    }
  }, 400);
}

function prevQuestion(){
  if(advancing) return;
  if(currentQ > 0){
    currentQ--;
    renderQuestion();
  }
}

function nextQuestion(){
  if(advancing) return;
  if(answers[currentQ] === -1) return;
  if(currentQ === QUESTIONS.length - 1){
    submitQuiz();
  }else{
    currentQ++;
    renderQuestion();
  }
}

// ==================================================================
//  提交 → 计算得分（min-max 归一化）
// ==================================================================
function submitQuiz(){
  const accum = {courage:0,wisdom:0,loyalty:0,aggression:0,teamwork:0,independence:0};
  const count = {courage:0,wisdom:0,loyalty:0,aggression:0,teamwork:0,independence:0};

  answers.forEach((ansIdx, qIdx)=>{
    if(ansIdx === -1) return;
    const chosenD = QUESTIONS[qIdx].options[ansIdx].d;
    DIMS.forEach((d, i)=>{
      const rng = Q_NORMS[qIdx][i];
      let v;
      if(rng.max === rng.min){
        v = 0.5;
      }else{
        v = (chosenD[i] - rng.min) / (rng.max - rng.min);
      }
      accum[d] += v;
      count[d] += 1;
    });
  });

  finalValues = DIMS.map(d=>{
    if(count[d] === 0) return 50;
    return Math.round(accum[d] / count[d] * 100);
  });

  showPage('pageLoading');
  const texts = ['正在解析你的人格数据','正在匹配 20 位英雄','正在生成专属人格画像','即将揭晓你的本命英雄'];
  let ti = 0;
  const timer = setInterval(()=>{
    ti++;
    if(ti < texts.length) document.getElementById('loadText').textContent = texts[ti];
  }, 550);

  setTimeout(()=>{
    clearInterval(timer);
    renderResult();
    showPage('pageResult');
  }, 2200);
}

// ==================================================================
//  匹配英雄（确定性欧氏距离，无随机）
// ==================================================================
function matchHero(){
  const norm = {};
  DIMS.forEach((d,i)=>{ norm[d] = finalValues[i] / 100; });

  let bestHero = HEROES[0];
  let bestDist = Infinity;
  HEROES.forEach(hero=>{
    const profile = HERO_PROFILES[hero.name];
    let dist = 0;
    DIMS.forEach(d=>{
      const diff = norm[d] - profile[d];
      dist += diff * diff;
    });
    if(dist < bestDist){
      bestDist = dist;
      bestHero = hero;
    }
  });
  return bestHero;
}

      <strong>${DIM_NAMES[minIdx]}</strong>是你的最低维度（${finalValues[minIdx]}分）。

// ==================================================================
//  手绘雷达图
// ==================================================================
function drawRadar(values, labels){
  const canvas = document.getElementById('radarCanvas');
  if(!canvas) return;
  const wrap = canvas.parentElement;
  const size = Math.min(wrap.clientWidth || 300, 320);
  const dpr = window.devicePixelRatio || 1;

  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);

  const cx = size / 2;
  const cy = size / 2 + 4;
  const R = size / 2 - 46;
  const n = labels.length;
  const angleStep = Math.PI * 2 / n;
  const startAngle = -Math.PI / 2;

  // 网格层
  const levels = 4;
  for(let l = 1; l <= levels; l++){
    const r = R * l / levels;
    ctx.beginPath();
    for(let i = 0; i < n; i++){
      const a = startAngle + angleStep * i;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(74,125,255,' + (0.06 + l * 0.05) + ')';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 轴线
  for(let i = 0; i < n; i++){
    const a = startAngle + angleStep * i;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
    ctx.strokeStyle = 'rgba(74,125,255,0.16)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 数据多边形
  const pts = values.map((v, i)=>{
    const a = startAngle + angleStep * i;
    const r = R * Math.max(0.06, Math.min(1, v / 100));
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  });

  const grad = ctx.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
  grad.addColorStop(0, 'rgba(74,125,255,0.38)');
  grad.addColorStop(0.5, 'rgba(139,92,246,0.32)');
  grad.addColorStop(1, 'rgba(6,182,212,0.28)');

  ctx.beginPath();
  pts.forEach((p, i)=>{ if(i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  pts.forEach((p, i)=>{ if(i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
  ctx.closePath();
  ctx.strokeStyle = '#4a7dff';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // 顶点
  pts.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p[0], p[1], 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = '#4a7dff';
    ctx.lineWidth = 2;
    ctx.stroke();
  });

  // 标签 + 数值
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  labels.forEach((label, i)=>{
    const a = startAngle + angleStep * i;
    const lx = cx + Math.cos(a) * (R + 26);
    const ly = cy + Math.sin(a) * (R + 26);

    ctx.font = '700 12px -apple-system,PingFang SC,sans-serif';
    ctx.fillStyle = '#3b4a6b';
    ctx.fillText(label, lx, ly - 7);

    ctx.font = '900 11px -apple-system,PingFang SC,sans-serif';
    ctx.fillStyle = '#4a7dff';
    ctx.fillText(values[i], lx, ly + 8);
  });
}

// ==================================================================
//  粒子背景
// ==================================================================
(function(){
  const canvas = document.getElementById('bgCanvas');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [];

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COLORS = ['rgba(74,125,255,', 'rgba(139,92,246,', 'rgba(6,182,212,'];

  for(let i = 0; i < 42; i++){
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      r: Math.random() * 1.8 + 0.8,
      c: COLORS[Math.floor(Math.random() * COLORS.length)],
      a: Math.random() * 0.35 + 0.15
    });
  }

  function draw(){
    ctx.clearRect(0, 0, w, h);

    for(let i = 0; i < particles.length; i++){
      for(let j = i + 1; j < particles.length; j++){
        const dx = particles[i].x - particles[j].x;
        const dy = particles[i].y - particles[j].y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if(dist < 110){
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = 'rgba(120,150,255,' + (0.07 * (1 - dist / 110)) + ')';
          ctx.lineWidth = 0.7;
          ctx.stroke();
        }
      }
    }

    particles.forEach(p=>{
      p.x += p.vx;
      p.y += p.vy;
      if(p.x < -10) p.x = w + 10;
      if(p.x > w + 10) p.x = -10;
      if(p.y < -10) p.y = h + 10;
      if(p.y > h + 10) p.y = -10;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.c + p.a + ')';
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
